name: Bug Report
description: Report a bug in the app
title: "[Bug]: "
type: Bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What goes wrong, and what should happen instead? Screenshots help.
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: Step by step, how do you trigger this?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: City, link to the page in production, app version, OS, browser, device.
  - type: textarea
    id: possible-causes
    attributes:
      label: Possible Causes
  - type: textarea
    id: related-issues
    attributes:
      label: Related Issues
      description: Related issues in Urbo or the city repos, the CMS bug report it came from.

name: Feature Request
description: Propose a new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposed-solutions
    attributes:
      label: Proposed Solution(s)
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
  - type: textarea
    id: related-issues
    attributes:
      label: Related Issues
      description: Links to related issues in Urbo, Kassel, Bamberg, Soest, Wesel
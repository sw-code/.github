name: Feature Request
description: Propose a new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and who has this problem?
  - type: textarea
    id: proposed-solutions
    attributes:
      label: Proposed Solution(s)
      description: Ideas and technical notes, if you have any.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
  - type: textarea
    id: related-issues
    attributes:
      label: Related Issues
      description: Related issues in Urbo or the city repos.
